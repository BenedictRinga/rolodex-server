# ─────────────────────────────────────────────────────────────────────────────
# LoopKeeper PWA at https://zyppar.com/loopkeeper/ (2026-08-22, build 57)
#
# The frontend production build now uses base-href /loopkeeper/ and the share
# URLs read https://zyppar.com/loopkeeper/ (clean path, LoopKeeper OG card).
# /openloop/ is kept only as a redirect so old links/shares still land.
#
# HOW TO APPLY (on the droplet):
#   1. Deploy the new build to /var/www/rolodex (same directory that
#      /openloop/ was using).
#   2. Add these location blocks inside the existing
#      `server { server_name zyppar.com; }` block, BEFORE the generic
#      `location / { try_files ...; }`.
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. Verify:
#      curl -s -A "WhatsApp/2.23.20.0" https://zyppar.com/loopkeeper/ \
#        | grep -o 'og:image[^>]*'
#        # -> https://zyppar.com/loopkeeper/assets/loopkeeper/og-1200x630.png
#      curl -sI https://zyppar.com/openloop/ | grep -i location
#        # -> 301 to /loopkeeper/
# ─────────────────────────────────────────────────────────────────────────────

# server {} level — add before the generic `location /`.
location = /loopkeeper/index.html {
    alias /var/www/rolodex/index.html;
    add_header Cache-Control "no-cache";
}

location /loopkeeper/ {
    alias /var/www/rolodex/;
    try_files $uri $uri/ /loopkeeper/index.html;
}

# Legacy /openloop/ -> /loopkeeper/ (old shares and bookmarks keep working)
location = /openloop/index.html {
    return 301 /loopkeeper/index.html;
}

location /openloop/ {
    return 301 /loopkeeper/;
}

# ─────────────────────────────────────────────────────────────────────────────
# 2026-08-26 API CANONICAL PATH (build 106 app / build 30 server) — REQUIRED
#
# The app now calls https://zyppar.com/api/loopkeeper/... as its canonical API
# path. The Node server rewrites /api/loopkeeper AND legacy /api/openloop to
# its internal /api/rolodex routes, so nginx only needs BOTH prefixes proxied
# to :4411. If /api/loopkeeper is NOT proxied, the new build's sync, updates,
# billing, AI chat and TTS all fail silently.
#
# Add next to the existing /api/openloop proxy block (adjust to however the
# current /api/openloop location is written on the droplet):
#
# location /api/loopkeeper/ {
#     proxy_pass http://127.0.0.1:4411;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
#
# KEEP the existing /api/openloop/ block (old deployed PWAs + already-sent
# invite OG links depend on it). Verify after reload:
#   curl -s https://zyppar.com/api/loopkeeper/health
#   curl -s https://zyppar.com/api/openloop/health   # legacy alias must survive
# ─────────────────────────────────────────────────────────────────────────────
